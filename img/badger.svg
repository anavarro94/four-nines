<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Four Nines honey badger mascot">
  <title>Four Nines honey badger</title>
  <!-- head (dark mask, pointed snout) -->
  <path d="M120 70C70 70 46 100 48 134c2 30 30 62 62 82 6 4 14 4 20 0 32-20 60-52 62-82 2-34-22-64-72-64z" fill="#1b1d1e"/>
  <!-- silver mantle: over the head and down both sides, scowling V brow -->
  <path d="M44 146C38 98 72 64 120 64s82 34 76 82c-6-12-16-20-28-22l-16 1c-10-3-22 3-32 12-10-9-22-15-32-12l-16-1c-12 2-22 10-28 22z" fill="#dcd6c8"/>
  <path d="M60 128c8-6 18-8 30-6M180 128c-8-6-18-8-30-6" fill="none" stroke="#b9b1a0" stroke-width="3" stroke-linecap="round"/>
  <!-- small round ears set in the mantle -->
  <path d="M44 130c0-9 6-14 13-13 5 1 7 6 6 11-4 2-12 3-19 2z" fill="#1b1d1e"/>
  <path d="M196 130c0-9-6-14-13-13-5 1-7 6-6 11 4 2 12 3 19 2z" fill="#1b1d1e"/>
  <!-- eyes -->
  <path d="M84 146c7-7 19-6 26 3-7 6-19 6-26-3z" fill="#fff"/>
  <path d="M156 146c-7-7-19-6-26 3 7 6 19 6 26-3z" fill="#fff"/>
  <circle cx="99" cy="147.5" r="5.5" fill="#1b1d1e"/>
  <circle cx="141" cy="147.5" r="5.5" fill="#1b1d1e"/>
  <circle cx="100.8" cy="145.8" r="1.8" fill="#fff"/>
  <circle cx="142.8" cy="145.8" r="1.8" fill="#fff"/>
  <!-- scowling brows -->
  <path d="M82 136l30 8M158 136l-30 8" stroke="#dcd6c8" stroke-width="5.5" stroke-linecap="round"/>
  <!-- muzzle -->
  <path d="M120 160c-16 0-27 13-27 28 0 13 12 26 27 28 15-2 27-15 27-28 0-15-11-28-27-28z" fill="#303336"/>
  <!-- nose -->
  <path d="M107 180c0-6 6-9 13-9s13 3 13 9c0 6-7 11-13 11s-13-5-13-11z" fill="#0b0c0d"/>
  <ellipse cx="115" cy="177" rx="3.6" ry="2" fill="#62676b"/>
  <!-- confident half-grin with a fang -->
  <path d="M120 191v5M108 199c6 6 20 6 26-3" fill="none" stroke="#0b0c0d" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M127 200l2.5 6 3-6.5z" fill="#fff"/>
  <!-- hard hat -->
  <path d="M58 98c0-36 27-62 62-62s62 26 62 62z" fill="#A36F2B"/>
  <path d="M84 50c-10 10-16 26-16 44" fill="none" stroke="#c99a5b" stroke-width="5" stroke-linecap="round"/>
  <rect x="38" y="94" width="164" height="15" rx="7.5" fill="#8c5f24"/>
  <rect x="38" y="94" width="164" height="5" rx="2.5" fill="#b98240"/>
  <text x="120" y="84" text-anchor="middle" font-family="'Big Shoulders Stencil Display',Impact,'Arial Black',sans-serif" font-weight="900" font-size="23" letter-spacing="1" fill="#14323F">9999</text>
</svg>
