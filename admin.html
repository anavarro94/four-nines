<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#14323F">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Four Nines — Office</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
</head>
<body class="app">

<header><div class="wrap bar">
  <h1><span class="wm"><b>FOUR NINES</b><small>OFFICE</small></span><span id="hTitle">Today</span></h1>
  <div class="row"><button class="hbtn" aria-label="Refresh" onclick="refresh()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
  <button class="hbtn" aria-label="Settings" onclick="openSettings()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div>
</div></header>

<main class="wrap" id="view"></main>

<nav class="tabs" id="tabs">
  <button data-t="Today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Today</button>
  <button data-t="Requests"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13L22 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/></svg>Requests<span class="badge" id="reqBadge" hidden></span></button>
  <button data-t="Jobs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg>Jobs</button>
  <button data-t="Billing"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>Billing</button>
  <button data-t="Customers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg>Clients</button>
  <button data-t="Expenses"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="13" rx="2"/><circle cx="12" cy="12.5" r="2.5"/><path d="M6 10v.01M18 15v.01"/></svg>Spent</button>
</nav>

<dialog id="dlg"></dialog>
<div id="print"></div>
<div id="toast"></div>

<script>
// ================= setup =================
const C = window.FN_CONFIG;
const TABLES = ['Requests','Customers','Jobs','Docs','Expenses'];
const JOB_STATUS = ['Lead','Quoted','Scheduled','In progress','Done','Paid'];
const DOC_STATUS = ['Draft','Sent','Accepted','Paid','Void'];
const EXP_CAT = ['Materials','Tools','Fuel','Disposal','Subcontractor','Other'];
const REMOTE = !!C.scriptUrl;
const LS = { get:k=>{try{return localStorage.getItem(k)}catch(e){return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}, del:k=>{try{localStorage.removeItem(k)}catch(e){}} };
let KEY = LS.get('fn_key') || '';
let DB = {}; TABLES.forEach(t => DB[t] = []);
const S = { tab: 'Today', jobFilter: 'Open', q: '', billFilter: 'All' };

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const money = n => '$' + (+n || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const digits = p => String(p || '').replace(/\D/g, '');
const fmtPhone = p => { const d = digits(p); return d.length === 10 ? `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}` : (p || ''); };
const fmtDate = s => { if (!s) return ''; const d = new Date(s.length === 10 ? s + 'T12:00' : s); return isNaN(d) ? s : d.toLocaleDateString(undefined, { month:'short', day:'numeric', year: d.getFullYear() !== new Date().getFullYear() ? 'numeric' : undefined }); };
const fmtWhen = s => { if (!s) return ''; const d = new Date(s); return isNaN(d) ? s : d.toLocaleString(undefined, { weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit' }); };
const thisMonth = s => String(s || '').slice(0, 7) === today().slice(0, 7);
const cust = id => DB.Customers.find(c => c.id === id);
const job = id => DB.Jobs.find(j => j.id === id);
const custName = id => cust(id)?.name || '—';
const pill = s => `<span class="pill ${esc(s)}">${esc(s)}</span>`;
const mapUrl = a => 'https://maps.google.com/?q=' + encodeURIComponent(a);
function toast(m, bad) { const t = $('#toast'); t.textContent = m; t.className = 'show' + (bad ? ' bad' : ''); clearTimeout(t._h); t._h = setTimeout(() => t.className = '', 2600); }
const items = d => Array.isArray(d.items) ? d.items : (() => { try { return JSON.parse(d.items || '[]'); } catch (e) { return []; } })();
function totals(d) { const sub = items(d).reduce((a, i) => a + (+i.qty || 0) * (+i.rate || 0), 0); const tax = sub * (+d.taxRate || 0) / 100; return { sub, tax, total: sub + tax }; }

// ================= data =================
async function api(p) {
  const r = await fetch(C.scriptUrl, { method: 'POST', body: JSON.stringify({ ...p, key: KEY }) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'Server error');
  return j;
}
async function load() {
  if (REMOTE) { const j = await api({ action: 'list' }); TABLES.forEach(t => DB[t] = j.data[t] || []); }
  else { let s = {}; try { s = JSON.parse(LS.get('fn_db') || '{}'); } catch (e) {} TABLES.forEach(t => DB[t] = s[t] || []); }
  TABLES.forEach(t => DB[t].sort((a, b) => String(b.created).localeCompare(String(a.created))));
}
function persist() { if (!REMOTE) LS.set('fn_db', JSON.stringify(DB)); }
async function save(t, row, quiet) {
  row.id = row.id || uid(); row.created = row.created || new Date().toISOString();
  const i = DB[t].findIndex(r => r.id === row.id);
  if (i >= 0) DB[t][i] = row; else DB[t].unshift(row);
  persist(); render();
  if (REMOTE) { try { await api({ action: 'save', table: t, row }); if (!quiet) toast('Saved'); } catch (e) { toast('Not saved to sheet: ' + e.message, true); } }
  else if (!quiet) toast('Saved');
  return row;
}
async function del(t, id) {
  DB[t] = DB[t].filter(r => r.id !== id); persist(); render();
  if (REMOTE) { try { await api({ action: 'delete', table: t, id }); } catch (e) { toast('Delete failed: ' + e.message, true); } }
}
async function refresh() { try { await load(); render(); toast('Up to date'); } catch (e) { toast(e.message, true); } }

// ================= rendering =================
function render() {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === S.tab));
  $('#hTitle').textContent = { Today:'Today', Jobs:'Jobs', Requests:'Requests', Customers:'Clients', Billing:'Billing', Expenses:'Expenses' }[S.tab];
  const n = DB.Requests.filter(r => !r.status || r.status === 'New').length;
  $('#reqBadge').hidden = !n; $('#reqBadge').textContent = n;
  $('#view').innerHTML = ({ Today: vToday, Jobs: vJobs, Requests: vRequests, Customers: vCustomers, Billing: vBilling, Expenses: vExpenses })[S.tab]();
}
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { S.tab = b.dataset.t; S.q = ''; render(); scrollTo(0, 0); });
const go = (tab, k, v) => { S.tab = tab; if (k) S[k] = v; render(); };

function stats() {
  const inv = DB.Docs.filter(d => d.type === 'invoice');
  const open = DB.Jobs.filter(j => !['Done','Paid'].includes(j.status)).length;
  const owed = inv.filter(d => !['Paid','Void','Draft'].includes(d.status)).reduce((a, d) => a + totals(d).total, 0);
  const paid = inv.filter(d => d.status === 'Paid' && thisMonth(d.paidDate || d.date)).reduce((a, d) => a + totals(d).total, 0);
  const spent = DB.Expenses.filter(e => thisMonth(e.date)).reduce((a, e) => a + (+e.amount || 0), 0);
  return `<div class="stats">
    <div class="stat"><b>${open}</b><span>Open jobs</span></div>
    <div class="stat"><b>${money(owed)}</b><span>Owed to you</span></div>
    <div class="stat"><b>${money(paid)}</b><span>Paid this month</span></div>
    <div class="stat"><b>${money(spent)}</b><span>Spent this month</span></div></div>`;
}
const chips = (opts, cur, key) => `<div class="chips">${opts.map(o => `<button class="chip ${o === cur ? 'on' : ''}" onclick="go(S.tab,'${key}','${o}')">${o}</button>`).join('')}</div>`;
const callBtns = p => digits(p) ? `<a class="btn alt" href="tel:${digits(p)}">Call</a><a class="btn ghost" href="sms:${digits(p)}">Text</a>` : '';

// ---- Jobs
function vJobs() {
  const f = S.jobFilter;
  let L = DB.Jobs.filter(j => f === 'All' ? true : f === 'Open' ? !['Done','Paid'].includes(j.status) : j.status === f);
  L.sort((a, b) => (a.scheduled || 'z').localeCompare(b.scheduled || 'z'));
  return stats() + `<div class="toolbar"><button class="btn" onclick="openForm('Jobs',{status:'Lead'})">+ New job</button></div>`
    + chips(['Open', ...JOB_STATUS, 'All'], f, 'jobFilter')
    + (L.length ? `<div class="list">${L.map(jobCard).join('')}</div>` : `<div class="empty">No jobs here yet.</div>`);
}
function jobCard(j) {
  const c = cust(j.customerId) || {}, addr = j.address || c.address;
  const docs = DB.Docs.filter(d => d.jobId === j.id);
  return `<div class="item"><div class="hd" onclick="openForm('Jobs',job('${j.id}'))">
    <div><h3>${esc(j.title || 'Untitled job')}</h3>
    <div class="meta">${esc(c.name || 'No customer')}${j.scheduled ? ' · ' + esc(fmtWhen(j.scheduled)) : ''}${+j.price ? ' · ' + money(j.price) : ''}</div>
    ${docs.length ? `<div class="meta">${docs.map(d => esc(d.number) + ' ' + d.status).join(' · ')}</div>` : ''}</div>${pill(j.status || 'Lead')}</div>
    <div class="acts">${nextBtn(j)}<button class="btn ghost" onclick="msgJob('${j.id}')">Message</button>${callBtns(c.phone)}${addr ? `<a class="btn ghost" target="_blank" href="${mapUrl(addr)}">Map</a>` : ''}
    <button class="btn ghost" onclick="newDoc('quote','${j.id}')">Quote</button>
    <button class="btn ghost" onclick="newDoc('invoice','${j.id}')">Invoice</button>
    <button class="btn ghost" onclick="openForm('Expenses',{date:today(),jobId:'${j.id}',category:'Materials'})">+ Expense</button></div></div>`;
}

// ---- Requests
function vRequests() {
  const order = { New: 0, '': 0, Replied: 1, Converted: 2, Archived: 3 };
  const L = [...DB.Requests].sort((a, b) => (order[a.status || ''] - order[b.status || '']) || String(b.created).localeCompare(String(a.created)));
  const note = REMOTE ? '' : `<div class="card small" style="margin-bottom:12px">Website quote requests show up here once the Google Sheet is connected (see README). Until then they arrive as text messages.</div>`;
  return note + (L.length ? `<div class="list">${L.map(r => {
    const ph = Array.isArray(r.photos) ? r.photos : String(r.photos || '').split(/\s+/).filter(Boolean);
    return `<div class="item"><div class="hd"><div><h3>${esc(r.name)} — ${esc(r.service)}</h3>
      <div class="meta">${esc(fmtDate(r.created))} · ${esc(fmtPhone(r.phone))}${r.email ? ' · ' + esc(r.email) : ''}</div></div>${pill(r.status || 'New')}</div>
      <p style="margin:8px 0 4px">${esc(r.details)}</p>
      <div class="meta">${esc(r.address)}${r.preferredTime ? ' · Best: ' + esc(r.preferredTime) : ''}</div>
      ${ph.length ? `<div class="thumbs">${ph.map((u, i) => `<a target="_blank" href="${esc(u)}">📷 Photo ${i + 1}</a>`).join('')}</div>` : ''}
      <div class="acts"><button class="btn brass" onclick="replyReq('${r.id}')">Reply</button>
      ${r.status === 'Converted' ? '' : `<button class="btn" onclick="quoteFromReq('${r.id}')">Quote it</button>`}
      ${contactBtns(r)}
      ${r.status === 'Converted' ? '' : `<button class="btn ghost" onclick="convert('${r.id}')">Make job</button>`}
      ${r.status === 'Archived' ? '' : `<button class="btn ghost" onclick="setReq('${r.id}','Archived')">Archive</button>`}</div></div>`;
  }).join('')}</div>` : `<div class="empty">No quote requests yet.</div>`);
}
function setReq(id, status) { const r = DB.Requests.find(x => x.id === id); save('Requests', { ...r, status }); }
async function convert(id, quiet) {
  const r = DB.Requests.find(x => x.id === id);
  let c = DB.Customers.find(x => (digits(x.phone) && digits(x.phone) === digits(r.phone)) || (x.email && r.email && x.email.toLowerCase() === r.email.toLowerCase()));
  if (!c) c = await save('Customers', { name: r.name, phone: r.phone, email: r.email, address: r.address, notes: '' }, true);
  const j = await save('Jobs', { title: r.service, customerId: c.id, address: r.address, status: 'Lead', scheduled: '', price: '',
    notes: r.details + (r.preferredTime ? `\nBest time: ${r.preferredTime}` : '') }, true);
  await save('Requests', { ...r, status: 'Converted' }, true);
  if (quiet) return j;
  S.tab = 'Jobs'; S.jobFilter = 'Open'; render(); toast('Job created'); openForm('Jobs', job(j.id));
  return j;
}

// ---- Customers
function vCustomers() {
  const q = S.q.toLowerCase();
  const L = DB.Customers.filter(c => !q || [c.name, c.phone, c.address, c.email].join(' ').toLowerCase().includes(q)).sort((a, b) => String(a.name).localeCompare(String(b.name)));
  return `<div class="toolbar"><input placeholder="Search customers" value="${esc(S.q)}" oninput="S.q=this.value;const p=this.selectionStart;render();const i=document.querySelector('.toolbar input');i.focus();i.setSelectionRange(p,p)">
    <button class="btn" onclick="openForm('Customers',{})">+ New</button></div>`
    + (L.length ? `<div class="list">${L.map(c => {
      const js = DB.Jobs.filter(j => j.customerId === c.id);
      const billed = DB.Docs.filter(d => d.customerId === c.id && d.type === 'invoice' && d.status === 'Paid').reduce((a, d) => a + totals(d).total, 0);
      return `<div class="item"><div class="hd" onclick="openForm('Customers',cust('${c.id}'))"><div><h3>${esc(c.name)}</h3>
        <div class="meta">${esc(fmtPhone(c.phone))}${c.address ? ' · ' + esc(c.address) : ''}</div>
        <div class="meta">${js.length} job${js.length === 1 ? '' : 's'}${billed ? ' · ' + money(billed) + ' paid' : ''}</div></div></div>
        <div class="acts">${callBtns(c.phone)}${c.address ? `<a class="btn ghost" target="_blank" href="${mapUrl(c.address)}">Map</a>` : ''}
        <button class="btn ghost" onclick="openForm('Jobs',{status:'Lead',customerId:'${c.id}'})">+ Job</button></div></div>`;
    }).join('')}</div>` : `<div class="empty">No customers${q ? ' match' : ' yet'}.</div>`);
}

// ---- Billing
function vBilling() {
  const f = S.billFilter;
  const L = DB.Docs.filter(d => f === 'All' ? true : f === 'Quotes' ? d.type === 'quote' : f === 'Invoices' ? d.type === 'invoice' : f === 'Unpaid' ? d.type === 'invoice' && !['Paid','Void'].includes(d.status) : true);
  return stats() + `<div class="toolbar"><button class="btn" onclick="newDoc('quote')">+ Quote</button><button class="btn alt" onclick="newDoc('invoice')">+ Invoice</button></div>`
    + chips(['All','Quotes','Invoices','Unpaid'], f, 'billFilter')
    + (L.length ? `<div class="list">${L.map(d => `<div class="item"><div class="hd" onclick="openDoc('${d.id}')"><div>
      <h3>${esc(d.number)} · ${money(totals(d).total)}</h3><div class="meta">${d.type === 'quote' ? 'Quote' : 'Invoice'} · ${esc(custName(d.customerId))} · ${esc(fmtDate(d.date))}</div></div>${pill(d.status || 'Draft')}</div>
      <div class="acts"><button class="btn ghost" onclick="printDoc('${d.id}')">View / send</button>
      ${d.type === 'invoice' && d.status !== 'Paid' ? `<button class="btn" onclick="markPaid('${d.id}')">Mark paid</button>` : ''}
      ${d.type === 'quote' ? `<button class="btn ghost" onclick="quoteToInvoice('${d.id}')">→ Invoice</button>` : ''}</div></div>`).join('')}</div>`
      : `<div class="empty">No ${f === 'All' ? 'quotes or invoices' : f.toLowerCase()} yet.</div>`);
}
function nextNum(type) {
  const pre = type === 'quote' ? 'Q-' : 'INV-';
  const n = DB.Docs.filter(d => String(d.number).startsWith(pre)).map(d => parseInt(String(d.number).slice(pre.length)) || 0);
  return pre + (Math.max(1000, ...n) + 1);
}
function newDoc(type, jobId) {
  const j = jobId ? job(jobId) : null;
  openDoc(null, { type, number: nextNum(type), date: today(), status: 'Draft', customerId: j?.customerId || '', jobId: jobId || '',
    items: [{ desc: j?.title || '', qty: 1, rate: j?.price || '' }], taxRate: C.taxRate || 0, notes: type === 'invoice' ? C.paymentNote : 'Quote valid for 30 days.' });
}
async function markPaid(id) {
  const d = DB.Docs.find(x => x.id === id);
  await save('Docs', { ...d, status: 'Paid', paidDate: d.paidDate || today() });
  if (d.jobId && job(d.jobId)) save('Jobs', { ...job(d.jobId), status: 'Paid' }, true);
}
function quoteToInvoice(id) {
  const q = DB.Docs.find(x => x.id === id);
  if (q.status !== 'Accepted') save('Docs', { ...q, status: 'Accepted' }, true);
  openDoc(null, { ...q, id: '', created: '', type: 'invoice', number: nextNum('invoice'), date: today(), status: 'Draft', notes: C.paymentNote, paidDate: '' });
}

// ---- Expenses
function vExpenses() {
  const months = {};
  DB.Expenses.forEach(e => { const m = String(e.date || '').slice(0, 7); (months[m] = months[m] || []).push(e); });
  const keys = Object.keys(months).sort().reverse();
  return `<div class="toolbar"><button class="btn" onclick="openForm('Expenses',{date:today(),category:'Materials'})">+ Expense</button></div>`
    + (keys.length ? keys.map(m => {
      const L = months[m].sort((a, b) => String(b.date).localeCompare(String(a.date)));
      const label = m ? new Date(m + '-15').toLocaleDateString(undefined, { month: 'long', year: 'numeric' }) : 'No date';
      return `<h3 style="margin:18px 0 8px;display:flex;justify-content:space-between"><span>${label}</span><span>${money(L.reduce((a, e) => a + (+e.amount || 0), 0))}</span></h3>
      <div class="list">${L.map(e => `<div class="item"><div class="hd" onclick="openForm('Expenses',DB.Expenses.find(x=>x.id==='${e.id}'))"><div>
        <h3>${money(e.amount)} · ${esc(e.vendor || e.category)}</h3><div class="meta">${esc(fmtDate(e.date))} · ${esc(e.category)}${e.description ? ' · ' + esc(e.description) : ''}${e.jobId && job(e.jobId) ? ' · ' + esc(job(e.jobId).title) : ''}</div></div></div></div>`).join('')}</div>`;
    }).join('') : `<div class="empty">No expenses logged yet.</div>`);
}


// ================= today =================
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const plusDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return ymd(d); };
const daysSince = s => s ? Math.floor((Date.now() - new Date(String(s).length === 10 ? s + 'T12:00' : s)) / 864e5) : 0;
const first = n => String(n || '').trim().split(/\s+/)[0] || 'there';
const timeOf = s => { const d = new Date(s); return isNaN(d) || String(s).length <= 10 ? '' : d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }); };
function dayLabel(s) {
  const k = String(s || '').slice(0, 10);
  if (k === today()) return new Date().getHours() >= 15 ? 'Tonight' : 'Today';
  if (k === plusDays(1)) return 'Tomorrow';
  const d = new Date(k + 'T12:00'); return isNaN(d) ? '' : d.toLocaleDateString(undefined, { weekday: 'short', month: 'numeric', day: 'numeric' });
}

    if (j.status === 'Lead' && !q.length) L.push({ t: `Send a quote to ${c}`, s: j.title, a: `newDoc('quote','${j.id}')`, b: 'Quote' });
    if (j.status === 'Quoted' && q.some(d => d.status === 'Accepted') && !j.scheduled) L.push({ t: `Schedule ${c}`, s: `${j.title} — quote accepted`, a: `openForm('Jobs',job('${j.id}'))`, b: 'Schedule' });
    if (['Scheduled', 'In progress'].includes(j.status) && j.scheduled && j.scheduled.slice(0, 10) < today()) L.push({ t: `Update ${c}'s job`, s: `${j.title} was scheduled ${fmtDate(j.scheduled.slice(0, 10))}`, a: `openForm('Jobs',job('${j.id}'))`, b: 'Update', warn: 1 });
    if (j.status === 'Done' && !inv.length) L.push({ t: `Invoice ${c}`, s: j.title + (+j.price ? ' · ' + money(j.price) : ''), a: `newDoc('invoice','${j.id}')`, b: 'Invoice', warn: 1 });

  DB.Docs.forEach(d => {

function nextBtn(j) {

  const b = (label, fn) => `<button class="btn nextbtn" onclick="${fn}">${label}</button>`;
  switch (j.status || 'Lead') {
    case 'Lead': return b('Send quote', `newDoc('quote','${j.id}')`);

    case 'Scheduled': return b('Start job', `setJob('${j.id}','In progress')`);
    case 'In progress': return b('Mark done', `setJob('${j.id}','Done')`);

function field([k, label, type], v) {
  v = v ?? '';

  if (Array.isArray(type)) inp = `<select name="${k}">${type.map(o => `<option ${o === v ? 'selected' : ''}>${o}</option>`).join('')}</select>`;
  else if (type === 'textarea') inp = `<textarea name="${k}">${esc(v)}</textarea>`;
  else if (type === 'customer') inp = `<select name="${k}" onchange="if(this.value==='__new')quickCust(this)">${custOpts(v)}</select>`;
  else if (type === 'job') inp = `<select name="${k}">${jobOpts(v)}</select>`;
  else inp = `<input name="${k}" type="${type || 'text'}" ${type === 'number' ? 'step="0.01" inputmode="decimal"' : ''} value="${esc(v)}">`;
  return `<label>${label}</label>${inp}`;

}
function drawItems() {
  $('#lis').innerHTML = `<div class="li small muted"><span>Description</span><span>Qty</span><span>Rate $</span><span></span></div>` +
    EDIT.items.map((it, i) => `<div class="li"><input name="desc" value="${esc(it.desc)}" oninput="EDIT.items[${i}].desc=this.value" placeholder="Labor, materials…">
    <input name="qty" type="number" step="0.25" inputmode="decimal" value="${esc(it.qty)}" oninput="EDIT.items[${i}].qty=this.value;drawTot()">
    <input name="rate" type="number" step="0.01" inputmode="decimal" value="${esc(it.rate)}" oninput="EDIT.items[${i}].rate=this.value;drawTot()">
    <button type="button" onclick="EDIT.items.splice(${i},1);drawItems()">×</button></div>`).join('');
  drawTot();
}
function drawTot() {
  const tr = $('#dlg form')?.taxRate?.value; const t = totals({ items: EDIT.items, taxRate: tr ?? EDIT.taxRate });
  $('#tot').innerHTML = `Subtotal ${money(t.sub)}${t.tax ? `<br>Tax ${money(t.tax)}` : ''}<br><b>Total ${money(t.total)}</b>`;
}

// ---- Printable / shareable view
function docHtml(d) {
  const c = cust(d.customerId) || {}, t = totals(d), j = job(d.jobId);
  const label = d.type === 'quote' ? 'QUOTE' : 'INVOICE';
  return `<div class="doc"><div class="dh"><div><h1 style="font-family:var(--serif)">${esc(C.legalName || C.businessName)}</h1>
    <div>${digits(C.phone) ? esc(fmtPhone(C.phone)) + '<br>' : ''}${esc(C.email)}<br>${esc(C.serviceArea)}</div></div>
    <div style="text-align:right"><h1 style="color:var(--accent2)">${label}</h1><div><b>${esc(d.number)}</b><br>Date: ${esc(fmtDate(d.date))}
    ${d.status === 'Paid' ? `<br><b style="color:var(--ok)">PAID ${esc(fmtDate(d.paidDate))}</b>` : ''}</div></div></div>
    <div><b>${d.type === 'quote' ? 'Prepared for' : 'Bill to'}:</b><br>${esc(c.name || '')}<br>${esc((j && j.address) || c.address || '')}<br>${esc(fmtPhone(c.phone))} ${c.email ? '· ' + esc(c.email) : ''}</div>
    ${j ? `<p><b>Job:</b> ${esc(j.title)}</p>` : ''}
    <table><thead><tr><th>Description</th><th>Qty</th><th>Rate</th><th>Amount</th></tr></thead><tbody>
    ${items(d).map(i => `<tr><td>${esc(i.desc)}</td><td>${esc(i.qty)}</td><td>${money(i.rate)}</td><td>${money((+i.qty || 0) * (+i.rate || 0))}</td></tr>`).join('')}</tbody></table>
    <div class="sum"><div><span>Subtotal</span><span>${money(t.sub)}</span></div>
    ${t.tax ? `<div><span>Tax (${esc(d.taxRate)}%)</span><span>${money(t.tax)}</span></div>` : ''}
    <div class="big"><span>${d.type === 'quote' ? 'Estimated total' : d.status === 'Paid' ? 'Total paid' : 'Amount due'}</span><span>${money(t.total)}</span></div></div>
    ${d.notes ? `<p style="margin-top:24px;white-space:pre-wrap">${esc(d.notes)}</p>` : ''}
    <p style="margin-top:28px;color:#666">Thank you for choosing ${esc(C.legalName || C.businessName)}!</p></div>`;
}
function printDoc(id) {
  const d = DB.Docs.find(x => x.id === id), c = cust(d.customerId) || {}, t = totals(d);
  const p = $('#print');
  const summary = `${C.businessName} ${d.type === 'quote' ? 'quote' : 'invoice'} ${d.number}: ${money(t.total)}${d.type === 'invoice' && d.status !== 'Paid' ? ' due' : ''}. ${items(d).map(i => i.desc).filter(Boolean).join(', ')}. ${digits(C.phone) ? 'Questions? Call ' + fmtPhone(C.phone) + '.' : 'Questions? Just reply to this email.'}`;
  p.innerHTML = `<div class="pbar"><button class="btn ghost" style="color:#fff;border-color:#fff5" onclick="closePrint()">← Back</button>
    <button class="btn" onclick="window.print()">Save PDF / Print</button>
    ${digits(c.phone) ? `<a class="btn alt" href="sms:${digits(c.phone)}?&body=${encodeURIComponent(summary)}">Text</a>` : ''}
    ${c.email && REMOTE ? `<button class="btn brass" id="emailPdf" onclick="emailDoc('${d.id}')">Email PDF to ${esc(first(c.name))}</button>` : ''}
    ${c.email && !REMOTE ? `<a class="btn alt" href="mailto:${esc(c.email)}?subject=${encodeURIComponent(C.businessName + ' ' + d.number)}&body=${encodeURIComponent(summary + '\n\nPDF attached.')}">Email</a>` : ''}</div>${docHtml(d)}`;
  p.classList.add('open'); document.body.classList.add('printing');
  if (d.status === 'Draft') saveDoc({ ...d, status: 'Sent' });
}
function closePrint() { $('#print').classList.remove('open'); document.body.classList.remove('printing'); }

// ================= settings & login =================
function openSettings() {
  const dlg = $('#dlg');
  dlg.innerHTML = `<form method="dialog"><h2>Settings</h2>
    <p><b>Storage:</b> ${REMOTE ? 'Google Sheet (syncs across your phone & computer)' : 'This device only — connect a Google Sheet to sync (see README)'}</p>
    <p class="small muted">${DB.Customers.length} customers · ${DB.Jobs.length} jobs · ${DB.Docs.length} quotes/invoices · ${DB.Expenses.length} expenses</p>
    <div class="row"><button type="button" class="btn ghost" onclick="exportData()">Download backup</button>
    ${REMOTE ? '' : `<label class="btn ghost" style="margin:0">Restore backup<input type="file" accept=".json" hidden onchange="importData(this.files[0])"></label>`}
    ${REMOTE ? `<button type="button" class="btn ghost" onclick="LS.del('fn_key');location.reload()">Log out</button>` : ''}</div>
    <div class="dlgacts"><button class="btn">Close</button></div></form>`;
  dlg.showModal();
}
function exportData() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(DB, null, 2)], { type: 'application/json' }));
  a.download = `four-nines-backup-${today()}.json`; a.click();
}
async function importData(file) {
  if (!file || !confirm('Replace everything on this device with this backup?')) return;
  const s = JSON.parse(await file.text()); TABLES.forEach(t => DB[t] = s[t] || []); persist(); $('#dlg').close(); render(); toast('Restored');
}
function loginScreen(err) {
  $('#tabs').hidden = true;
  $('#view').innerHTML = `<form class="card login" id="lf"><div class="lwm">FOUR NINES<small>OFFICE · ENTERPRISE, LLC</small></div>
    <label>Passcode</label><input type="password" name="k" autocomplete="current-password" required>
    ${err ? `<div class="msg bad">${esc(err)}</div>` : ''}<button class="btn" style="width:100%;margin-top:14px">Unlock</button></form>`;
  $('#lf').onsubmit = async e => { e.preventDefault(); KEY = e.target.k.value; try { await load(); LS.set('fn_key', KEY); start(); } catch (x) { loginScreen(x.message); } };
}
function start() { $('#tabs').hidden = false; render(); }

(async () => {
  if (!REMOTE) { await load(); start(); return; }
  if (!KEY) return loginScreen();
  try { await load(); start(); } catch (e) { loginScreen(e.message); }
})();
</script>
</body>
</html>
